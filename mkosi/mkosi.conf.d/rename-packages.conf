# Packages renamed for a separate repository cannot populate the images: those install them under
# the names the packaging repository gives them, which the rename is there to move away from. The
# initrd asks for systemd, systemd-libs and systemd-sysvcompat by name in particular, and its
# prepare script fails looking for them.
#
# A package-only build does not need an image at all, but it still gets the default initrd, because
# Bootable= defaults to auto and the kernel in Packages= makes that mean yes. Say no instead.

[Match]
Environment=RENAME_PACKAGES=1

[Content]
Bootable=no
